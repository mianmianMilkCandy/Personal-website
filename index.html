<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#8fc3e6" />

    <!-- 主题在样式生效前定下来，否则首屏会先闪一下另一套令牌。
         2026-10 起只有一套主题（晴空白昼），所以这里不再读 localStorage：
         用户上次存的 'dusk' 不该再把页面变回深色。
         这一段是内联同步脚本，不能改成模块（模块是延迟执行的）。 -->
    <script>
      document.documentElement.dataset.theme = 'day'
    </script>

    <title>云绵绵甜奶糖 · Python 后端 / AI 应用开发</title>
    <meta
      name="description"
      content="云绵绵甜奶糖的个人主页 —— Python 后端与 AI 应用开发，本地知识库 / RAG 实践，两项软件著作权与两个开源项目。"
    />

    <!-- 字体：Inter Tight（拉丁显示体）+ JetBrains Mono（等宽元数据）。
         离线或网络受限时自动回落到系统字体栈，不影响可读性与排版节奏。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
    />

    <!-- 连续背景的两张图预加载：它们**首屏就可见**，而首屏的 LCP 元素就是
         这块天空。底图 371 KB / 列车精灵 238 KB，都在 show 出来之前就得开始拉。
         地址**必须带 %BASE_URL%**（vite.config.ts 里 base: './'）：写成 '/media/…'
         在子目录部署（GitHub Pages 的 /repo/ 路径）下会 404。 -->
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%media/sky-plate.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%media/sky-train.webp"
      type="image/webp"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      本站需要启用 JavaScript 才能正常浏览。本站为纯静态站点，不会收集任何数据。
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
